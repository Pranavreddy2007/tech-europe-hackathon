[project]
name = "govmind"
version = "0.2.0"
description = "GovMind — autonomous AI governance operator for DAOs, on WhatsApp, served from Modal"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.7",
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-socketio>=5.11",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "matplotlib>=3.9",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "modal>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["govmind"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
